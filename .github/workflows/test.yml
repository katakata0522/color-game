name: Test color game

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check theme-safety.js
          node --check tests/static-check.cjs

      - name: Run static regression checks
        run: node tests/static-check.cjs

      - name: Verify the AI Studio preview serves the game
        shell: bash
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run dev &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          preview_url=http://127.0.0.1:3000
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 "$preview_url/" | cmp - index.html
          for asset in style.css notice.css script.js theme-safety.js accessibility.js; do
            curl -fsS "$preview_url/$asset" | cmp - "$asset"
          done
